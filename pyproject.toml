[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# The pytest-homeassistant-custom-component plugin (if installed) is not needed
# by these HA-free unit tests and breaks on Windows (fcntl import).
addopts = "-p no:homeassistant"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint.per-file-ignores]
# Keep the reverse-engineered API constants file readable as data tables
"custom_components/dreame_wet_dry_vacuum/const.py" = ["E501"]
